<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Leadership Baseline View — Data portal</title>
<style>
:root{--ink:#183b45;--teal:#218b86;--soft:#eaf5f3;--line:#d9e4e4;--bg:#f6f8f8;--muted:#65777b;--red:#a5332b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin:0 0 18px;box-shadow:0 8px 24px #163b4410}h1,h2{margin:.1em 0 .45em}p{margin:.4em 0 1em}.muted{color:var(--muted)}.hidden{display:none!important}.row,.actions,.links{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn,button{border:1px solid var(--teal);background:#fff;color:var(--ink);border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}.primary{background:var(--teal);color:#fff}.danger{color:var(--red);border-color:#e8bbb8}.field{display:grid;gap:5px;margin:12px 0}.field input,.field select,#pass{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.assessment{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.counts{font-size:13px;color:var(--muted)}.linkrow{display:grid;grid-template-columns:115px 1fr auto;gap:8px;align-items:center;margin:8px 0}.linkrow input{min-width:0;padding:8px;border:1px solid var(--line);border-radius:7px}.role{margin-top:20px;border-top:3px solid var(--teal);padding-top:12px}.submission{border:1px solid var(--line);border-radius:9px;margin:9px 0}.submission summary{cursor:pointer;padding:11px;font-weight:700}.tablewrap{overflow:auto;border-top:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid #edf1f1}th{background:var(--soft);position:sticky;top:0}.answer{white-space:nowrap;font-weight:650}.error{color:var(--red)}@media(max-width:650px){.linkrow{grid-template-columns:1fr}.wrap{padding:14px 10px}}
</style></head><body><main class="wrap">
<section id="gate" class="card" style="max-width:460px;margin:10vh auto"><h1>Data portal</h1><p class="muted">The Creative Leadership Baseline View</p><div class="field"><label>Passcode</label><input id="pass" type="password"></div><p id="gateError" class="error"></p><button id="login" class="primary">Continue</button></section>
<section id="dashboard" class="hidden"><div class="row between"><div><h1>Assessments</h1><p class="muted">Collected response data only. Interpretation is completed separately.</p></div><div class="actions"><button id="newBtn" class="primary">New assessment</button><button id="logout">Log out</button></div></div><div id="list" class="grid"></div></section>
<section id="newView" class="hidden"><div class="card"><h1>New assessment</h1><form id="newForm"><div class="field"><label>Company</label><input id="company" required></div><div class="field"><label>Team</label><input id="team" required></div><div class="field"><label>Label (optional)</label><input id="label"></div><div class="field"><label>Question set</label><select id="set"></select></div><p id="formError" class="error"></p><div class="actions"><button class="primary">Create assessment</button><button type="button" id="cancel">Cancel</button></div></form></div><div id="created" class="card hidden"><h2>Share these links</h2><div id="createdLinks"></div><button id="done" class="primary">Done</button></div></section>
<section id="report" class="hidden"><div class="actions"><button id="back">← Assessments</button></div><div class="card"><div class="row between"><div><h1 id="reportTitle">Assessment data</h1><p id="reportMeta" class="muted"></p></div><div class="actions"><button id="csv">Download CSV</button><button id="json">Download JSON</button></div></div><div id="reportLinks"></div></div><div id="responses"></div></section>
</main><script>
(function(){
var state={key:'',assessments:[],sets:[],current:null,Q:null,rows:[]};
var $=function(id){return document.getElementById(id)},esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function show(id){['gate','dashboard','newView','report'].forEach(function(x){$(x).classList.toggle('hidden',x!==id)})}
async function api(path,opts){var sep=path.indexOf('?')>=0?'&':'?';var r=await fetch(path+sep+'key='+encodeURIComponent(state.key),opts);if(r.status===401)throw new Error('unauthorized');return r}
function copy(text,btn){navigator.clipboard.writeText(text).then(function(){var old=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=old},1000)})}
function linkRows(links,prefix){return[['leader','Team Leader'],['member','Team Member'],['observer','Team Observer']].map(function(x){return'<div class="linkrow"><b>'+x[1]+'</b><input id="'+prefix+x[0]+'" readonly value="'+esc(links[x[0]])+'"><button data-copy="'+esc(links[x[0]])+'">Copy</button></div>'}).join('')}
document.addEventListener('click',function(e){var b=e.target.closest('[data-copy]');if(b)copy(b.dataset.copy,b)})
$('login').onclick=async function(){state.key=$('pass').value;try{var r=await api('/api/assessments');if(!r.ok)throw new Error();state.assessments=await r.json();showDash()}catch(e){$('gateError').textContent='Passcode not recognised.'}}
$('logout').onclick=function(){state={key:'',assessments:[],sets:[],current:null,Q:null,rows:[]};$('pass').value='';show('gate')}
async function refresh(){var r=await api('/api/assessments');state.assessments=await r.json()}
function showDash(){show('dashboard');var list=$('list');if(!state.assessments.length){list.innerHTML='<div class="card muted">No assessments yet.</div>';return}list.innerHTML=state.assessments.map(function(a){var total=a.leaderCount+a.memberCount+a.observerCount;return'<article class="assessment" data-id="'+esc(a.id)+'"><h2>'+esc(a.company)+' — '+esc(a.teamName)+'</h2><p class="muted">'+esc(a.label||'')+'</p><p class="counts">'+a.leaderCount+' leader · '+a.memberCount+' member · '+a.observerCount+' observer · '+total+' total</p><div class="actions"><button class="open primary">View data</button><button class="delete danger">Delete</button></div></article>'}).join('');list.querySelectorAll('.assessment').forEach(function(el){el.querySelector('.open').onclick=function(){openReport(el.dataset.id)};el.querySelector('.delete').onclick=async function(){if(!confirm('Delete this assessment and all responses?'))return;await api('/api/assessments/'+encodeURIComponent(el.dataset.id),{method:'DELETE'});await refresh();showDash()}})}
$('newBtn').onclick=async function(){show('newView');$('created').classList.add('hidden');var r=await api('/api/questionsets');state.sets=await r.json();$('set').innerHTML=state.sets.map(function(s){return'<option value="'+esc(s.id)+'">'+esc(s.title)+' ('+s.questionCount+' questions)</option>'}).join('')}
$('cancel').onclick=function(){showDash()};$('done').onclick=async function(){await refresh();showDash()};$('back').onclick=function(){showDash()}
$('newForm').onsubmit=async function(e){e.preventDefault();var body={company:$('company').value,teamName:$('team').value,label:$('label').value,questionSetId:$('set').value};var r=await api('/api/assessments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var data=await r.json();if(!r.ok){$('formError').textContent=data.error||'Could not create assessment';return}$('createdLinks').innerHTML=linkRows(data.links,'new-');$('created').classList.remove('hidden')}
async function openReport(id){show('report');var a=state.assessments.find(function(x){return x.id===id});state.current=a;var qr=await fetch('/api/questions/'+encodeURIComponent(id));var dr=await api('/api/data?assessment='+encodeURIComponent(id));state.Q=await qr.json();state.rows=await dr.json();$('reportTitle').textContent=a.company+' — '+a.teamName+(a.label?' · '+a.label:'');$('reportMeta').textContent='57 questions · fixed four-section order · '+state.rows.length+' submitted response'+(state.rows.length===1?'':'s');$('reportLinks').innerHTML=linkRows(a.links,'rep-');renderResponses()}
function renderResponses(){var roles=[['leader','Team Leader'],['member','Team Member'],['observer','Team Observer']];var all=state.Q.personal.concat(state.Q.team);$('responses').innerHTML=roles.map(function(pair){var rows=state.rows.filter(function(r){return r.role===pair[0]});return'<section class="card role"><h2>'+pair[1]+' responses ('+rows.length+')</h2>'+(rows.length?rows.map(function(r,i){var by={};(r.answers||[]).forEach(function(a){by[a.id]=a});var trs=all.map(function(q){var a=by[q.id]||{};return'<tr><td>'+esc(q.id)+'</td><td>Section '+q.section+'</td><td>'+esc(q.text)+'</td><td class="answer">'+esc(a.label||'')+'</td></tr>'}).join('');return'<details class="submission"><summary>Response '+(i+1)+' · '+esc(new Date(r.submittedAt).toLocaleString())+'</summary><div class="tablewrap"><table><thead><tr><th>Ref</th><th>Section</th><th>Question</th><th>Recorded answer</th></tr></thead><tbody>'+trs+'</tbody></table></div></details>'}).join(''):'<p class="muted">No responses collected for this role.</p>')+'</section>'}).join('')}
$('csv').onclick=function(){location.href='/api/data?format=csv&assessment='+encodeURIComponent(state.current.id)+'&key='+encodeURIComponent(state.key)};$('json').onclick=function(){var blob=new Blob([JSON.stringify(state.rows,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='creative-leadership-baseline-view-'+state.current.id+'.json';a.click();URL.revokeObjectURL(a.href)};
show('gate');
})();
</script></body></html>
