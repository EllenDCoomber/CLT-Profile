<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CLT Profile</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f5fafa;
        color: #111;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
        padding: 3rem;
        text-align: center;
        background: #fff;
        border-top: 0.4rem solid #00b5b8;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 10%);
      }

      h1 {
        margin: 0 0 1rem;
        color: #00a2a5;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
      }

      p {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World!</h1>
      <p>The CLT Profile website is connected and working.</p>
    </main>
  </body>
</html>
