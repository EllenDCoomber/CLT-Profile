<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLT Profile — Results (mockup)</title>
  <script src="../config.js"></script>
  <script src="../questions.js"></script>
  <style>
    :root {
      --teal: #00b5b8;
      --teal-dark: #00a2a5;
      --teal-soft: #e3f6f6;
      --ink: #17252a;
      --muted: #5c6b70;
      --line: #dfe8ea;
      --bg: #f5fafa;
      --card: #ffffff;
      --warn: #b3261e;
    }
    * { box-sizing: border-box; }
    html { font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--ink); }
    body { margin: 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem clamp(1rem, 4vw, 2rem);
      border-bottom: 1px solid var(--line);
      background: var(--card);
      font-size: 0.9rem;
    }
    .topbar .mark { font-weight: 700; color: var(--teal-dark); }
    .topbar .chip {
      background: var(--teal-soft); color: var(--teal-dark);
      border-radius: 999px; padding: 0.15rem 0.6rem; font-weight: 600;
    }
    #app { max-width: 74rem; margin: 0 auto; padding: 1.5rem clamp(0.75rem, 2vw, 2rem) 4rem; }
    .card {
      background: var(--card); border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgb(0 0 0 / 8%);
      padding: clamp(1.25rem, 3vw, 2rem);
      margin-bottom: 1.5rem;
    }
    .card h1 { margin: 0 0 0.4rem; color: var(--teal-dark); font-size: clamp(1.5rem, 3.5vw, 2.1rem); }
    .card h2 { margin: 0 0 1rem; font-size: 1.15rem; color: var(--ink); }
    .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .counts { display: flex; gap: 0.5rem 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; font-weight: 600; }
    .counts b { color: var(--teal-dark); }
    .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--teal); background: var(--card); color: var(--teal-dark);
      border-radius: 0.5rem; padding: 0.55rem 1rem; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: var(--teal-soft); }
    .btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
    .btn.primary:hover { background: var(--teal-dark); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .panel { border: 1px solid var(--line); border-radius: 0.75rem; padding: 1rem 1.1rem; }
    .panel h3 { margin: 0 0 0.7rem; font-size: 0.95rem; }
    .bar-row { margin-bottom: 0.6rem; }
    .bar-row .lbl { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.2rem; }
    .bar { height: 0.55rem; border-radius: 999px; background: var(--teal-soft); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--teal); border-radius: 999px; }
    .legend { display: flex; gap: 1rem; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.7rem; }
    .legend i { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 3px; margin-right: 0.3rem; vertical-align: -0.05rem; }
    .legend .lg-lead i { background: #0b7a7c; }
    .legend .lg-mem i { background: var(--teal); }
    .list { margin: 0; padding: 0; list-style: none; font-size: 0.85rem; }
    .list li { padding: 0.4rem 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 1rem; }
    .list li:last-child { border-bottom: 0; }
    .list .txt { color: var(--muted); }
    .list .val { font-weight: 600; white-space: nowrap; }
    .list .val.up { color: var(--teal-dark); }
    .list .val.down { color: var(--warn); }
    .tag {
      display: inline-block; font-size: 0.68rem; color: var(--muted);
      background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
      padding: 0.08rem 0.5rem; margin-bottom: 0.35rem;
    }
    .tag.pressure { color: #8a5a00; background: #fff6e0; border-color: #f0ddb0; }
    details { margin-bottom: 1.5rem; }
    details summary {
      cursor: pointer; font-weight: 700; color: var(--teal-dark); padding: 0.4rem 0;
    }
    table.tally { border-collapse: collapse; width: 100%; font-size: 0.8rem; margin-top: 0.5rem; }
    table.tally th, table.tally td { border: 1px solid var(--line); padding: 0.3rem 0.5rem; text-align: center; }
    table.tally th { background: var(--bg); font-weight: 600; }
    table.tally td.stmt { text-align: left; max-width: 24rem; }
    table.tally td.na { color: var(--muted); }
    .section-label {
      display: flex; align-items: center; gap: 0.6rem;
      font-weight: 700; color: var(--teal-dark); font-size: 1.05rem;
      margin: 0 0 0.75rem;
    }
    .section-label .count {
      font-size: 0.75rem; color: var(--muted); font-weight: 400;
      background: var(--bg); border-radius: 999px; padding: 0.1rem 0.5rem;
    }
    .person { padding: 1.2rem 0; border-top: 1px solid var(--line); }
    .person:first-of-type { padding-top: 0.5rem; border-top: 0; }
    .person .who { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .person .who b { color: var(--ink); }
    .person .who .sub { font-size: 0.82rem; color: var(--muted); }
    .subhead { font-weight: 700; font-size: 0.85rem; color: var(--ink); margin: 1rem 0 0.5rem; }
    .qrow { padding: 0.45rem 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; }
    .qrow:last-child { border-bottom: 0; }
    .qrow .qtext { font-size: 0.9rem; line-height: 1.4; }
    .pill {
      flex-shrink: 0; background: var(--teal-soft); color: var(--teal-dark);
      border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.8rem; font-weight: 700;
      white-space: nowrap;
    }
    .pill.na { background: var(--bg); color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
    .empty { color: var(--muted); font-size: 0.9rem; }
    footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 1rem 0 2rem; }
    .error { color: var(--warn); font-size: 0.85rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="mark">&#9685; CLT Profile</span>
    <span class="chip">Results</span>
  </div>

  <div id="app">
    <div class="card" id="summaryCard">
      <h1>Team survey results</h1>
      <div class="meta" id="generatedMeta"></div>
      <div class="counts" id="countsLine"></div>
      <div class="actions">
        <button class="btn primary" id="copyText">Copy as text</button>
        <button class="btn" id="dlCsv">Download CSV</button>
        <button class="btn" id="dlJson">Download JSON</button>
        <button class="btn" id="refresh">Refresh</button>
      </div>
      <div class="error" id="err" hidden></div>
    </div>

    <div class="card">
      <h2>What the data shows</h2>
      <div class="grid" id="insightsGrid"></div>
    </div>

    <details id="summaryTable" open>
      <summary>Per-question summary (members)</summary>
      <div style="overflow-x:auto"><table class="tally" id="tallyTable"></table></div>
    </details>

    <div class="card" id="leaderCard">
      <div class="section-label">Team Leader</div>
      <div id="leaderBody"></div>
    </div>

    <div class="card" id="memberCard">
      <div class="section-label">Team Members <span class="count" id="memberCount"></span></div>
      <div id="memberBody"></div>
    </div>

    <footer>Mockup — sample data for design review, not live results.</footer>
  </div>

  <script>
    var QUESTIONS = window.CLT_QUESTIONS;
    var TEAM = QUESTIONS.team;
    var PERSONAL = QUESTIONS.personal;
    var PSCALE = QUESTIONS.personalScale;
    var TSCALE = QUESTIONS.teamScale;

    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    var rng = mulberry32(42);
    function pick(w, lo, hi) { return lo + Math.floor(w() * (hi - lo + 1)); }
    function pickIn(weights) {
      var total = weights.reduce(function (a, b) { return a + b; }, 0);
      var r = rng() * total, acc = 0;
      for (var i = 0; i < weights.length; i++) { acc += weights[i]; if (r < acc) return i; }
      return weights.length - 1;
    }

    function buildAnswers(role) {
      var a = {};
      PERSONAL.forEach(function (p, i) {
        var w = role === 'leader' ? [1, 2, 4, 6, 4] : [1, 3, 4, 5, 3];
        a[p.id] = pickIn(w) + 1;
      });
      TEAM.forEach(function (t) {
        var base = t.context === 'Pressure Shift' ? [2, 3, 4, 3, 2] : [1, 2, 3, 4, 3];
        if (t.principle === 'Synergy' || t.principle === 'Self') base = [1, 2, 3, 4, 3];
        var v = pickIn(base) + 1;
        if (rng() < (t.context === 'Pressure Shift' ? 0.10 : 0.04)) v = 6;
        a[t.id] = v;
      });
      return a;
    }

    function daysAgo(d) {
      var dt = new Date();
      dt.setDate(dt.getDate() - d);
      return dt.toISOString().replace('T', ' ').slice(0, 16);
    }

    var responses = [];
    function addResponse(role, company, department, d, answers) {
      responses.push({ role: role, company: company, department: department, submittedAt: daysAgo(d), answers: answers });
    }

    var leaderA = buildAnswers('leader');
    addResponse('leader', 'Acme Marketing', 'Brand & Comms', 2, leaderA);
    for (var m = 0; m < 7; m++) {
      addResponse('member', null, null, 1 + m * 2, buildAnswers('member'));
    }
    responses.sort(function (a, b) { return a.submittedAt > b.submittedAt ? -1 : 1; });

    function labelFor(id, v) {
      return v === 6 ? 'N/A' : (id.indexOf('P') === 0 ? PSCALE : TSCALE)[v - 1];
    }

    function mean(vals) {
      var s = 0, n = 0;
      vals.forEach(function (v) { if (v && v !== 6) { s += v; n++; } });
      return n ? s / n : null;
    }

    function principleStats(people) {
      var map = {};
      TEAM.forEach(function (t) { if (!map[t.principle]) map[t.principle] = []; map[t.principle].push(t.id); });
      var out = {};
      Object.keys(map).forEach(function (p) {
        var vals = [];
        map[p].forEach(function (id) { people.forEach(function (r) { vals.push(r.answers[id]); }); });
        out[p] = mean(vals);
      });
      return out;
    }

    function membersOnly() { return responses.filter(function (r) { return r.role === 'member'; }); }
    function leaderOnly() { return responses.filter(function (r) { return r.role === 'leader'; }); }

    var members = membersOnly();
    var leaders = leaderOnly();
    var memberPrinc = principleStats(members);
    var leaderPrinc = principleStats(leaders);

    var now = new Date();
    document.getElementById('generatedMeta').textContent =
      'Generated ' + now.toDateString() + ' ' + now.toTimeString().slice(0, 5) + ' · ' + responses.length + ' responses';
    document.getElementById('countsLine').innerHTML =
      'Team Leader: <b>' + leaders.length + '</b> &nbsp;·&nbsp; Team Members: <b>' + members.length + '</b>';
    document.getElementById('memberCount').textContent = members.length;

    function barPanel() {
      var el = document.createElement('div');
      el.className = 'panel';
      var names = Object.keys(memberPrinc).sort();
      var html = '<h3>Principle profile (team vs leader)</h3><div class="legend">' +
        '<span class="lg-lead"><i></i>Leader</span><span class="lg-mem"><i></i>Members</span></div>';
      names.forEach(function (p) {
        var lm = mean([leaderPrinc[p]]) || 0;
        var mm = mean([memberPrinc[p]]) || 0;
        html += '<div class="bar-row"><div class="lbl"><span>' + p + '</span><span>' +
          mm.toFixed(1) + ' / ' + lm.toFixed(1) + '</span></div>' +
          '<div class="bar"><span style="width:' + (mm / 5 * 100) + '%"></span></div></div>';
      });
      el.innerHTML = html;
      return el;
    }

    function matchedPairsPanel() {
      var pairs = [['S5', 'S9'], ['S15', 'S16'], ['S31', 'S32'], ['S34', 'S35'], ['S49', 'S48'], ['S51', 'S52']];
      var el = document.createElement('div');
      el.className = 'panel';
      var html = '<h3>Baseline vs Pressure Shift (team)</h3><ul class="list">';
      pairs.forEach(function (pair) {
        var bId = pair[0], pId = pair[1];
        var bVals = members.map(function (r) { return r.answers[bId]; });
        var pVals = members.map(function (r) { return r.answers[pId]; });
        var bm = mean(bVals), pm = mean(pVals);
        var delta = bm && pm ? (pm - bm) : null;
        var bStmt = TEAM.filter(function (t) { return t.id === bId; })[0];
        var cls = delta < -0.2 ? 'down' : (delta > 0.2 ? 'up' : '');
        html += '<li><span class="txt">' + bStmt.text.slice(0, 42) + '…</span><span class="val ' + cls + '">' +
          (bm ? bm.toFixed(1) : '–') + ' → ' + (pm ? pm.toFixed(1) : '–') + (delta ? ' (' + (delta >= 0 ? '+' : '') + delta.toFixed(1) + ')' : '') +
          '</span></li>';
      });
      html += '</ul><div style="font-size:0.78rem;color:var(--muted);margin-top:0.5rem">Negative = team behaviours weaken under pressure.</div>';
      el.innerHTML = html;
      return el;
    }

    function strengthsPanel() {
      var rows = [];
      TEAM.forEach(function (t) {
        var vals = members.map(function (r) { return r.answers[t.id]; });
        var m = mean(vals);
        if (m) rows.push({ id: t.id, m: m, text: t.text });
      });
      rows.sort(function (a, b) { return b.m - a.m; });
      var top = rows.slice(0, 3), bot = rows.slice(-3).reverse();
      var el = document.createElement('div');
      el.className = 'panel';
      var html = '<h3>Strengths &amp; development areas (members)</h3>';
      html += '<div class="subhead" style="margin-top:0">Strongest</div><ul class="list">';
      top.forEach(function (r) { html += '<li><span class="txt">' + r.text.slice(0, 40) + '…</span><span class="val up">' + r.m.toFixed(1) + '</span></li>'; });
      html += '</ul><div class="subhead">Development</div><ul class="list">';
      bot.forEach(function (r) { html += '<li><span class="txt">' + r.text.slice(0, 40) + '…</span><span class="val down">' + r.m.toFixed(1) + '</span></li>'; });
      html += '</ul>';
      el.innerHTML = html;
      return el;
    }

    function consensusPanel() {
      var rows = [];
      TEAM.forEach(function (t) {
        var vals = members.map(function (r) { return r.answers[t.id]; }).filter(function (v) { return v && v !== 6; });
        if (vals.length < 3) return;
        var m = mean(vals);
        var sd = Math.sqrt(vals.reduce(function (a, v) { return a + (v - m) * (v - m); }, 0) / vals.length);
        rows.push({ id: t.id, sd: sd, m: m, text: t.text });
      });
      rows.sort(function (a, b) { return a.sd - b.sd; });
      var aligned = rows.slice(0, 2), split = rows.slice(-2).reverse();
      var naCounts = {};
      TEAM.forEach(function (t) {
        naCounts[t.id] = members.filter(function (r) { return r.answers[t.id] === 6; }).length;
      });
      var naRows = TEAM.filter(function (t) { return naCounts[t.id] > 0; })
        .sort(function (a, b) { return naCounts[b.id] - naCounts[a.id]; }).slice(0, 3);
      var el = document.createElement('div');
      el.className = 'panel';
      var html = '<h3>Alignment &amp; blind spots</h3>';
      html += '<div class="subhead" style="margin-top:0">Most aligned</div><ul class="list">';
      aligned.forEach(function (r) { html += '<li><span class="txt">' + r.text.slice(0, 40) + '…</span><span class="val up">σ ' + r.sd.toFixed(1) + '</span></li>'; });
      html += '</ul><div class="subhead">Most divided</div><ul class="list">';
      split.forEach(function (r) { html += '<li><span class="txt">' + r.text.slice(0, 40) + '…</span><span class="val down">σ ' + r.sd.toFixed(1) + '</span></li>'; });
      html += '</ul>';
      if (naRows.length) {
        html += '<div class="subhead">Rarely observed (N/A)</div><ul class="list">';
        naRows.forEach(function (t) { html += '<li><span class="txt">' + t.text.slice(0, 40) + '…</span><span class="val">' + naCounts[t.id] + '×</span></li>'; });
        html += '</ul>';
      }
      el.innerHTML = html;
      return el;
    }

    var grid = document.getElementById('insightsGrid');
    [barPanel(), matchedPairsPanel(), strengthsPanel(), consensusPanel()].forEach(function (p) { grid.appendChild(p); });

    function personHTML(r) {
      var html = '<div class="person"><div class="who"><b>' +
        (r.role === 'leader' ? (r.company || 'Team Leader') : 'Member') +
        '</b><span class="sub">' + (r.role === 'leader' ? (r.company + ' · ' + r.department + ' · ') : '') + 'submitted ' + r.submittedAt + '</span></div>';
      html += '<div class="subhead">About you</div>';
      PERSONAL.forEach(function (p) {
        var v = r.answers[p.id];
        html += '<div class="qrow"><span class="qtext">' + p.text + '</span><span class="pill' + (v === 6 ? ' na' : '') + '">' + labelFor(p.id, v) + '</span></div>';
      });
      html += '<div class="subhead">About the team</div>';
      TEAM.forEach(function (t) {
        var v = r.answers[t.id];
        var cls = t.context === 'Pressure Shift' ? ' pressure' : '';
        html += '<div class="tag' + cls + '">' + t.ref + ' · ' + t.context + ' · ' + t.principle + '</div>' +
          '<div class="qrow"><span class="qtext">' + t.text + '</span><span class="pill' + (v === 6 ? ' na' : '') + '">' + labelFor(t.id, v) + '</span></div>';
      });
      html += '</div>';
      return html;
    }

    document.getElementById('leaderBody').innerHTML = leaders.map(personHTML).join('');
    document.getElementById('memberBody').innerHTML = members.map(personHTML).join('');

    var tally = document.getElementById('tallyTable');
    var thead = '<thead><tr><th>Question</th><th>Never</th><th>Rarely</th><th>Half the time</th><th>Often</th><th>Almost always</th><th>N/A</th></tr></thead>';
    var rows = '<tbody>';
    PERSONAL.forEach(function (p, i) {
      var counts = [0, 0, 0, 0, 0];
      members.forEach(function (r) { counts[r.answers[p.id] - 1]++; });
      rows += '<tr><td class="stmt">P' + (i + 1) + '. ' + p.text + '</td><td>' + counts[0] + '</td><td>' + counts[1] + '</td><td>' + counts[2] + '</td><td>' + counts[3] + '</td><td>' + counts[4] + '</td><td class="na">—</td></tr>';
    });
    TEAM.forEach(function (t) {
      var counts = [0, 0, 0, 0, 0, 0];
      members.forEach(function (r) { counts[r.answers[t.id] - 1]++; });
      rows += '<tr><td class="stmt">' + t.ref + '. ' + t.text + '</td><td>' + counts[0] + '</td><td>' + counts[1] + '</td><td>' + counts[2] + '</td><td>' + counts[3] + '</td><td>' + counts[4] + '</td><td class="na">' + counts[5] + '</td></tr>';
    });
    rows += '</tbody>';
    tally.innerHTML = thead + rows;

    function transcript() {
      var lines = ['CLT PROFILE — RESPONSES', 'Generated ' + new Date().toDateString(), ''];
      responses.forEach(function (r) {
        lines.push('=== ' + (r.role === 'leader' ? 'TEAM LEADER' : 'MEMBER') + ' ===');
        if (r.role === 'leader') lines.push('Company: ' + r.company + ' · Department: ' + r.department);
        lines.push('Submitted: ' + r.submittedAt);
        lines.push('');
        lines.push('PERSONAL');
        PERSONAL.forEach(function (p, i) { lines.push((i + 1) + '. ' + p.text + ' → ' + labelFor(p.id, r.answers[p.id])); });
        lines.push('');
        lines.push('TEAM');
        TEAM.forEach(function (t) {
          lines.push(t.ref + ' [' + t.context + ' · ' + t.principle + '] ' + t.text + ' → ' + labelFor(t.id, r.answers[t.id]));
        });
        lines.push('');
      });
      return lines.join('\n');
    }

    function csv() {
      var head = ['role', 'company', 'department', 'submittedAt'].concat(
        PERSONAL.map(function (p) { return p.id; }),
        TEAM.map(function (t) { return t.id; }));
      var out = [head.join(',')];
      responses.forEach(function (r) {
        var row = [r.role, '"' + (r.company || '') + '"', '"' + (r.department || '') + '"', '"' + r.submittedAt + '"'];
        PERSONAL.forEach(function (p) { row.push(r.answers[p.id]); });
        TEAM.forEach(function (t) { row.push(r.answers[t.id]); });
        out.push(row.join(','));
      });
      return out.join('\n');
    }

    document.getElementById('copyText').addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(transcript()).then(function () {
          flash('Copied to clipboard');
        }, function () { prompt('Copy from here:', transcript()); });
      } else {
        prompt('Copy from here:', transcript());
      }
    });
    document.getElementById('dlCsv').addEventListener('click', function () { download('clt-results.csv', csv()); });
    document.getElementById('dlJson').addEventListener('click', function () { download('clt-results.json', JSON.stringify(responses, null, 2)); });
    document.getElementById('refresh').addEventListener('click', function () { location.reload(); });

    function download(name, content) {
      var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function flash(msg) {
      var el = document.getElementById('err');
      el.hidden = false;
      el.textContent = msg;
      setTimeout(function () { el.hidden = true; }, 2500);
    }
  </script>
</body>
</html>
